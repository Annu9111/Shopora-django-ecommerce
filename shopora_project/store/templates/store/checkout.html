{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout | Shopora</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body>

<div class="container mt-5">

  <h2 class="text-center mb-4">🧾 Checkout</h2>

  <div class="row">

    <!-- 🧍 USER DETAILS -->
    <div class="col-md-6">

      <div class="card shadow p-4 checkout-card">
        <h5 class="mb-3">Shipping Details</h5>

        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control input-style" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control input-style" rows="3" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control input-style" required>
          </div>

          <button type="submit" class="btn btn-success w-100 btn-login">
            Place Order
          </button>
        </form>

      </div>

    </div>

    <!-- 💰 ORDER SUMMARY -->
    <div class="col-md-6">

      <div class="card shadow p-4 checkout-card">

        <h5 class="mb-3">Order Summary</h5>

        <hr>

        <h4 class="text-success">Total: ₹ {{ total_price }}</h4>

        <p class="text-muted mt-2">
          Your order will be processed after confirmation.
        </p>

      </div>

    </div>

  </div>

</div>

</body>
</html>
