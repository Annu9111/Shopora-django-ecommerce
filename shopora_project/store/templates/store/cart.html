{% load static %}
<!DOCTYPE html>
<html>

<head>
  <title>Cart - Shopora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container mt-5">
    <h2 class="text-center mb-4">🛒 Your Cart</h2>

    {% if cart_items %}
    <div class="row">

      {% for item in cart_items %}
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">

          <!-- Image -->
          <img src="{{ item.product.image.url }}" class="card-img-top"
            style="height:200px; object-fit:cover;">

          <!-- Body -->
          <div class="card-body text-center">

            <!-- Product Name -->
            <h5>{{ item.product.name }}</h5>

            <!-- Quantity Controls -->
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">

              <a href="{% url 'decrease_quantity' item.id %}"
                class="btn btn-outline-danger btn-sm">−</a>

              <span class="fw-bold">{{ item.quantity }}</span>

              <a href="{% url 'increase_quantity' item.id %}"
                class="btn btn-outline-success btn-sm">+</a>

            </div>

            <!-- Item Total -->
            <p class="text-success fw-bold">
              Total: ₹{{ item.total }}
            </p>

            <!-- Remove Button -->
            <a href="{% url 'remove_from_cart' item.id %}"
              class="btn btn-danger btn-sm">
              Remove
            </a>

          </div>

        </div>
      </div>
      {% endfor %}

    </div>

    <!-- Grand Total -->
    <div class="text-center mt-4">
      <h3>Total Price: ₹{{ total_price }}</h3>
      <a href="{% url 'checkout' %}" class="btn btn-success btn-lg">Checkout</a>
    </div>

    {% else %}
    <h4 class="text-center text-muted">Your cart is empty 😢</h4>
    {% endif %}

  </div>

</body>

</html>
