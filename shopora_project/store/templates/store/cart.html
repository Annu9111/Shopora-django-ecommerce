{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Cart - Shopora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">🛒 Your Cart</h2>

    {% if cart_items %}
        <div class="row">
            {% for item in cart_items %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">

                    <img src="{{ item.product.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">

                    <div class="card-body text-center">
                        <h5>{{ item.product.name }}</h5>
                        <p class="text-success fw-bold">₹{{ item.product.price }}</p>

                        <a href="#" class="btn btn-danger btn-sm">Remove</a>
                    </div>

                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-success btn-lg">Checkout</button>
        </div>

    {% else %}
        <h4 class="text-center text-muted">Your cart is empty 😢</h4>
    {% endif %}
</div>

</body>
</html>
