{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopora</title>
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="{% static 'store/images/logo.png' %}" width="40" class="me-2">
            SHOPORA
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Cart</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <!-- Hero Section -->
    <div class="container text-center mt-5">
        <h1>Welcome to Shopora 🚀</h1>
        <p>Your non-stop online store</p>
        <button class="btn btn-primary">Start Shopping</button>
    </div>

    <div class="container mt-5">
    <h2 class="text-center mb-4">Our Products 🛒</h2>
    
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">
                {% else %}
                <img src="https://via.placeholder.com/200">
                {% endif %}
                
                <div class="card-body text-center">
                    <h5>{{ product.name }}</h5>
                    <p class="text-success fw-bold">₹{{ product.price }}</p>
                    <button class="btn btn-outline-primary btn-sm">Add to Cart</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
