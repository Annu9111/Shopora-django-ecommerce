{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} | Shopora</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body>

<div class="container mt-5">

    <div class="row align-items-center">

        <!-- 🖼️ Product Image -->
        <div class="col-md-6 text-center">
            <div class="product-image-box p-3 shadow">
                <img src="{{ product.image.url }}" class="img-fluid rounded product-img">
            </div>
        </div>

        <!-- 📦 Product Details -->
        <div class="col-md-6">

            <h2 class="mb-3">{{ product.name }}</h2>

            <h3 class="text-success mb-3">₹ {{ product.price }}</h3>

            <p class="text-muted">{{ product.description }}</p>

            <!-- Buttons -->
            <div class="mt-4">

                <a href="{% url 'add_to_cart' product.id %}" 
                   class="btn btn-primary me-2 btn-lg">
                    🛒 Add to Cart
                </a>

                <a href="{% url 'cart' %}" 
                   class="btn btn-outline-dark btn-lg">
                    Go to Cart
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
