{% load static %}
<!DOCTYPE html>
<html>

<head>
  <title>Wishlist | Shopora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body>

<div class="container mt-5">

  <h2 class="text-center mb-4">❤️ My Wishlist</h2>

  {% if items %}

  <div class="row">

    {% for item in items %}
    <div class="col-md-3 mb-4">

      <div class="card shadow-sm product-card">

        <img src="{{ item.product.image.url }}" class="card-img-top product-img">

        <div class="card-body text-center">
          <h6>{{ item.product.name }}</h6>
          <p class="text-success">₹ {{ item.product.price }}</p>

          <div class="d-flex justify-content-center gap-2">

            <a href="{% url 'product_detail' item.product.id %}" class="btn btn-outline-dark btn-sm">
              View
            </a>

            <a href="{% url 'add_to_cart' item.product.id %}" class="btn btn-primary btn-sm">
              Add
            </a>

          </div>

          <a href="{% url 'remove_from_wishlist' item.id %}" 
             class="btn btn-outline-danger btn-sm mt-2">
             Remove
          </a>

        </div>

      </div>

    </div>
    {% endfor %}

  </div>

  {% else %}

  <div class="text-center">
    <h5>Your wishlist is empty 💔</h5>
    <a href="{% url 'products' %}" class="btn btn-primary mt-3">Explore Products</a>
  </div>

  {% endif %}

</div>

</body>
</html>
