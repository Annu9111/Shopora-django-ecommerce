{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login | Shopora</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body class="auth-bg">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4 login-card">

    <h3 class="text-center mb-4">🔐 Login to Shopora</h3>

    <!-- Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <input 
        type="text" 
        name="username" 
        placeholder="Username" 
        class="form-control mb-3 input-style" 
        required
      >

      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        class="form-control mb-3 input-style" 
        required
      >

      <button class="btn btn-primary w-100 btn-login">
        Login
      </button>
    </form>

    <p class="mt-3 text-center">
      Don't have an account? 
      <a href="{% url 'register' %}" class="text-decoration-none">Register</a>
    </p>

  </div>

</div>

</body>
</html>
