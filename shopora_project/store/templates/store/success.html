{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Order Success | Shopora</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body class="success-bg">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow text-center p-5 success-card">

    <!-- Success Icon -->
    <div class="mb-3">
      <h1 class="success-icon">✔</h1>
    </div>

    <h2 class="text-success mb-3">Order Placed Successfully!</h2>

    <p class="lead">Thank you for shopping with <strong>Shopora</strong> ❤️</p>

    <p class="text-muted">
      Your order has been confirmed and will be delivered soon.
    </p>

    <div class="mt-4">

      <a href="{% url 'products' %}" class="btn btn-primary me-2">
        Continue Shopping
      </a>

      <a href="{% url 'orders' %}" class="btn btn-outline-dark">
        View Orders
      </a>

    </div>

  </div>

</div>

</body>
</html>
