{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Products - Shopora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">🛍️ All Products</h2>

    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">

                <img src="{{ product.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">

                <div class="card-body text-center">
                    <h5>{{ product.name }}</h5>
                    <p class="text-success fw-bold">₹{{ product.price }}</p>

                    <a href="{% url 'product_detail' product.id %}" class="btn btn-primary btn-sm">
                        View
                    </a>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
