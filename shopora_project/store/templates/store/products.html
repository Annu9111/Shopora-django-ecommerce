{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Products | Shopora</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">🛍️ All Products</h2>

    <!-- 🔍 Search + Filter -->
    <div class="row mb-4">

        <!-- Search -->
        <div class="col-md-6">
            <form method="GET">
                <input 
                    type="text" 
                    name="q" 
                    class="form-control" 
                    placeholder="Search products..."
                    value="{{ request.GET.q }}"
                >
            </form>
        </div>

        <!-- Sort -->
        <div class="col-md-3">
            <select class="form-select" name="sort" onchange="this.form.submit()">
                <option value="">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

    </div>

    <!-- Products -->
    <div class="row">

        {% for product in products %}
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4">

            <div class="card product-card shadow-sm h-100">

                <!-- Image -->
                <a href="{% url 'product_detail' product.id %}">
                    <img src="{{ product.image.url }}" class="card-img-top product-img">
                </a>

                <!-- Info -->
                <div class="card-body text-center">
                    <h6 class="card-title">{{ product.name }}</h6>

                    <p class="text-success fw-bold">₹ {{ product.price }}</p>

                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'product_detail' product.id %}" class="btn btn-outline-dark btn-sm">
                            View
                        </a>

                        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary btn-sm">
                            Add
                        </a>
                    </div>
                </div>

            </div>

        </div>
        {% endfor %}

    </div>

    <!-- Empty State -->
    {% if not products %}
    <div class="text-center mt-5">
        <h5>No products found 😔</h5>
    </div>
    {% endif %}

</div>

</body>
</html>
